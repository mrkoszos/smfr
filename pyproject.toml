[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smfr-core"
version = "0.1.0"
description = "Reference implementation of SMFR versioning Draft 0.1"
requires-python = ">=3.10"

[project.scripts]
smfr = "smfr.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
